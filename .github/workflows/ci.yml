name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]
    env:
      SDL_VIDEODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pre-commit hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (black)
        run: black --check .

      - name: Check import sort (isort)
        run: isort --check-only .

      - name: Type check (mypy)
        run: python -m mypy src --show-error-codes

      - name: Run tests
        run: python -m pytest -q

      - name: Fail if tests modified repository assets
        # Detect any changes (modified / deleted / untracked) under the `assets/` directory
        run: |
          set -o pipefail
          echo "Checking for repository changes after test run..."
          git --no-pager status --porcelain | tee changed.txt
          # If any changed path is under assets/, fail the job and show a diff
          if grep -qE '^(.{2} )?assets/' changed.txt || grep -qE '^\?\? assets/' changed.txt; then
            echo "ERROR: Tests modified files under assets/ -- this is not allowed."
            echo "Changed files:"
            grep -E 'assets/' changed.txt || true
            echo "--- git diff (repo assets) ---"
            git --no-pager diff -- assets/ || true
            exit 1
          fi
